<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1030" width="1520" height="1030" font-family="Helvetica, Arial, sans-serif">
  <rect width="1520" height="1030" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="bold" fill="#232F3E">FlightData Manager — infrastruttura AWS realizzata</text>
  <text x="40" y="72" font-size="15" fill="#666">Due zone simmetriche e indipendenti. In grigio tratteggiato i componenti previsti dallo schema e impediti dal piano dell'account.</text>

  <!-- ══════════ SERVIZI ESTERNI ══════════ -->
  <rect x="40" y="110" width="400" height="150" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5"/>
  <text x="56" y="134" font-size="13" font-weight="bold" fill="#666">SERVIZI ESTERNI</text>

  <rect x="60" y="148" width="360" height="44" rx="5" fill="#ffffff" stroke="#0B7285" stroke-width="1.5"/>
  <text x="76" y="168" font-size="14" font-weight="bold" fill="#0B7285">Neo4j Aura (AuraDB Free)</text>
  <text x="76" y="185" font-size="12" fill="#2B8A3E">✓ raggiunto via NAT, TLS, nessuna modifica al codice</text>

  <rect x="60" y="202" width="360" height="44" rx="5" fill="#ffffff" stroke="#C92A2A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="76" y="222" font-size="14" font-weight="bold" fill="#C92A2A">OpenSky Network API</text>
  <text x="76" y="239" font-size="12" fill="#C92A2A">✗ timeout da AWS — filtro sugli IP dei cloud provider</text>

  <!-- ══════════ LAPTOP ══════════ -->
  <rect x="40" y="450" width="400" height="130" rx="8" fill="#fff9db" stroke="#F59F00" stroke-width="2"/>
  <text x="56" y="476" font-size="14" font-weight="bold" fill="#B37500">POSTAZIONE DI LAVORO</text>
  <text x="56" y="502" font-size="13" fill="#333">kubectl port-forward svc/nginx 8443:443</text>
  <text x="56" y="524" font-size="12" fill="#666">Tunnel autenticato attraverso l'API server EKS,</text>
  <text x="56" y="540" font-size="12" fill="#666">non una rotta di rete. Richiede credenziali IAM</text>
  <text x="56" y="556" font-size="12" fill="#666">e un access entry sul cluster.</text>
  <text x="56" y="572" font-size="12" font-weight="bold" fill="#B37500">È l'unico ingresso: nessun indirizzo pubblico.</text>

  <!-- ══════════ AWS CLOUD ══════════ -->
  <rect x="490" y="100" width="990" height="760" rx="8" fill="none" stroke="#232F3E" stroke-width="2.5"/>
  <text x="508" y="126" font-size="15" font-weight="bold" fill="#232F3E">AWS Cloud</text>

  <rect x="512" y="140" width="946" height="702" rx="6" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="528" y="162" font-size="13" font-weight="bold" fill="#00A4A6">Region eu-south-1 (Milano)</text>

  <!-- ─── VPC ─── -->
  <rect x="534" y="178" width="640" height="646" rx="6" fill="none" stroke="#8C4FFF" stroke-width="2"/>
  <text x="550" y="200" font-size="13" font-weight="bold" fill="#8C4FFF">VPC 10.0.0.0/16</text>

  <!-- ── AZ A ── -->
  <rect x="552" y="214" width="296" height="486" rx="5" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="566" y="234" font-size="13" font-weight="bold" fill="#147EBA">eu-south-1a</text>

  <rect x="566" y="246" width="268" height="112" rx="4" fill="#f4f9ec" stroke="#7AA116" stroke-width="1.5"/>
  <text x="578" y="266" font-size="12" font-weight="bold" fill="#5C7A10">public subnet · 10.0.0.0/24</text>
  <rect x="578" y="274" width="244" height="34" rx="4" fill="#ffffff" stroke="#7AA116"/>
  <text x="590" y="296" font-size="13" fill="#333">NAT Gateway</text>
  <rect x="578" y="314" width="244" height="34" rx="4" fill="#ffffff" stroke="#7AA116"/>
  <text x="590" y="336" font-size="13" fill="#333">Elastic IP</text>

  <rect x="566" y="370" width="268" height="106" rx="4" fill="#eef7f7" stroke="#00A4A6" stroke-width="1.5"/>
  <text x="578" y="390" font-size="12" font-weight="bold" fill="#00787A">private app · 10.0.16.0/20</text>
  <rect x="578" y="398" width="244" height="68" rx="4" fill="#ffffff" stroke="#00A4A6"/>
  <text x="590" y="418" font-size="13" fill="#333">Nodi EKS · t3.small</text>
  <text x="590" y="435" font-size="11" fill="#777">nessun IP pubblico</text>
  <text x="590" y="452" font-size="11" fill="#777">egress → NAT di questa zona</text>

  <rect x="566" y="488" width="268" height="198" rx="4" fill="#eef7f7" stroke="#00A4A6" stroke-width="1.5"/>
  <text x="578" y="508" font-size="12" font-weight="bold" fill="#00787A">private data · 10.0.48.0/24</text>
  <text x="578" y="524" font-size="11" font-style="italic" fill="#C92A2A">nessuna rotta verso internet</text>
  <rect x="578" y="532" width="244" height="66" rx="4" fill="#ffffff" stroke="#C2255C"/>
  <text x="590" y="552" font-size="13" font-weight="bold" fill="#333">RDS PostgreSQL 16</text>
  <text x="590" y="569" font-size="11" fill="#777">db.t4g.micro · istanza primaria</text>
  <text x="590" y="586" font-size="11" fill="#777">replica sincrona verso la zona b</text>
  <rect x="578" y="606" width="244" height="66" rx="4" fill="#ffffff" stroke="#C2255C"/>
  <text x="590" y="626" font-size="13" font-weight="bold" fill="#333">ElastiCache Redis 7</text>
  <text x="590" y="643" font-size="11" fill="#777">cache.t3.micro · nodo primario</text>
  <text x="590" y="660" font-size="11" fill="#777">replication group</text>

  <!-- ── AZ B ── -->
  <rect x="862" y="214" width="296" height="486" rx="5" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="876" y="234" font-size="13" font-weight="bold" fill="#147EBA">eu-south-1b</text>

  <rect x="876" y="246" width="268" height="112" rx="4" fill="#f4f9ec" stroke="#7AA116" stroke-width="1.5"/>
  <text x="888" y="266" font-size="12" font-weight="bold" fill="#5C7A10">public subnet · 10.0.1.0/24</text>
  <rect x="888" y="274" width="244" height="34" rx="4" fill="#ffffff" stroke="#7AA116"/>
  <text x="900" y="296" font-size="13" fill="#333">NAT Gateway</text>
  <rect x="888" y="314" width="244" height="34" rx="4" fill="#ffffff" stroke="#7AA116"/>
  <text x="900" y="336" font-size="13" fill="#333">Elastic IP</text>

  <rect x="876" y="370" width="268" height="106" rx="4" fill="#eef7f7" stroke="#00A4A6" stroke-width="1.5"/>
  <text x="888" y="390" font-size="12" font-weight="bold" fill="#00787A">private app · 10.0.32.0/20</text>
  <rect x="888" y="398" width="244" height="68" rx="4" fill="#ffffff" stroke="#00A4A6"/>
  <text x="900" y="418" font-size="13" fill="#333">Nodi EKS · t3.small</text>
  <text x="900" y="435" font-size="11" fill="#777">nessun IP pubblico</text>
  <text x="900" y="452" font-size="11" fill="#777">egress → NAT di questa zona</text>

  <rect x="876" y="488" width="268" height="198" rx="4" fill="#eef7f7" stroke="#00A4A6" stroke-width="1.5"/>
  <text x="888" y="508" font-size="12" font-weight="bold" fill="#00787A">private data · 10.0.49.0/24</text>
  <text x="888" y="524" font-size="11" font-style="italic" fill="#C92A2A">nessuna rotta verso internet</text>
  <rect x="888" y="532" width="244" height="66" rx="4" fill="#ffffff" stroke="#C2255C"/>
  <text x="900" y="552" font-size="13" font-weight="bold" fill="#333">RDS — standby</text>
  <text x="900" y="569" font-size="11" fill="#777">sincrono, stesso endpoint</text>
  <text x="900" y="586" font-size="11" fill="#777">failover automatico in 1-2 min</text>
  <rect x="888" y="606" width="244" height="66" rx="4" fill="#ffffff" stroke="#C2255C"/>
  <text x="900" y="626" font-size="13" font-weight="bold" fill="#333">ElastiCache — replica</text>
  <text x="900" y="643" font-size="11" fill="#777">primary_endpoint_address</text>
  <text x="900" y="660" font-size="11" fill="#777">segue il primario corrente</text>

  <!-- ── NOTA RIDONDANZA ── -->
  <rect x="552" y="712" width="606" height="98" rx="5" fill="#ebfbee" stroke="#2B8A3E" stroke-width="1.5"/>
  <text x="568" y="734" font-size="13" font-weight="bold" fill="#2B8A3E">✓ ZONE SIMMETRICHE E INDIPENDENTI</text>
  <text x="568" y="756" font-size="12" fill="#333">Ogni zona ha il proprio NAT Gateway e la propria route table: il traffico in uscita non attraversa mai l'altra zona.</text>
  <text x="568" y="775" font-size="12" fill="#333">Database e cache hanno una replica nella zona opposta, con failover automatico dietro un endpoint invariato.</text>
  <text x="568" y="796" font-size="12" font-style="italic" fill="#2B8A3E">La perdita di una qualsiasi delle due zone è sopravvivibile — non solo quella della zona b.</text>

  <!-- ─── SERVIZI GESTITI ─── -->
  <rect x="1192" y="178" width="252" height="386" rx="6" fill="#fafafa" stroke="#232F3E" stroke-width="1.5"/>
  <text x="1206" y="200" font-size="13" font-weight="bold" fill="#232F3E">SERVIZI GESTITI</text>

  <rect x="1206" y="214" width="224" height="60" rx="4" fill="#ffffff" stroke="#D9822B" stroke-width="1.5"/>
  <text x="1218" y="234" font-size="13" font-weight="bold" fill="#333">EKS control plane</text>
  <text x="1218" y="251" font-size="11" fill="#777">v1.35 · multi-AZ gestito da AWS</text>
  <text x="1218" y="266" font-size="11" fill="#777">endpoint pubblico + privato</text>

  <rect x="1206" y="284" width="224" height="50" rx="4" fill="#ffffff" stroke="#D9822B"/>
  <text x="1218" y="303" font-size="13" fill="#333">ECR — 5 repository</text>
  <text x="1218" y="321" font-size="11" fill="#777">pull via endpoint S3, non dal NAT</text>

  <rect x="1206" y="344" width="224" height="62" rx="4" fill="#ffffff" stroke="#D9822B"/>
  <text x="1218" y="364" font-size="13" fill="#333">SSM Parameter Store</text>
  <text x="1218" y="382" font-size="11" fill="#777">13 valori runtime</text>
  <text x="1218" y="398" font-size="11" fill="#777">endpoint, credenziali, password</text>

  <rect x="1206" y="416" width="224" height="62" rx="4" fill="#ffffff" stroke="#D9822B"/>
  <text x="1218" y="436" font-size="13" fill="#333">S3 — stato OpenTofu</text>
  <text x="1218" y="454" font-size="11" fill="#777">versionato, cifrato, privato</text>
  <text x="1218" y="470" font-size="11" fill="#777">lock nativo (use_lockfile)</text>

  <rect x="1206" y="488" width="224" height="58" rx="4" fill="#ffffff" stroke="#D9822B"/>
  <text x="1218" y="508" font-size="13" fill="#333">VPC Endpoint S3</text>
  <text x="1218" y="526" font-size="11" fill="#777">gateway, gratuito</text>
  <text x="1218" y="541" font-size="11" fill="#777">tiene i pull ECR fuori dal NAT</text>

  <!-- ─── OSSERVABILITÀ ─── -->
  <rect x="1192" y="580" width="252" height="120" rx="6" fill="#f3f0ff" stroke="#7048E8" stroke-width="1.5"/>
  <text x="1206" y="602" font-size="13" font-weight="bold" fill="#5F3DC4">OSSERVABILITÀ (in-cluster)</text>
  <text x="1206" y="624" font-size="12" fill="#333">kube-prometheus-stack</text>
  <text x="1206" y="642" font-size="12" fill="#333">Metrics Server</text>
  <text x="1206" y="662" font-size="11" fill="#777">ServiceMonitor su user-manager</text>
  <text x="1206" y="678" font-size="11" fill="#777">e data-collector — target UP</text>
  <text x="1206" y="695" font-size="11" font-style="italic" fill="#5F3DC4">Stessi script del deploy locale</text>

  <!-- ─── SICUREZZA ─── -->
  <rect x="1192" y="716" width="252" height="120" rx="6" fill="#fafafa" stroke="#2B8A3E" stroke-width="1.5"/>
  <text x="1206" y="738" font-size="13" font-weight="bold" fill="#2B8A3E">ACCESSO E SICUREZZA</text>
  <text x="1206" y="759" font-size="11" fill="#555">OIDC — nessuna chiave statica</text>
  <text x="1206" y="777" font-size="11" fill="#555">Security group senza egress</text>
  <text x="1206" y="793" font-size="11" fill="#555">sui due database</text>
  <text x="1206" y="811" font-size="11" fill="#555">Superficie pubblica: nessuna</text>
  <text x="1206" y="828" font-size="11" fill="#555">mTLS fra i microservizi</text>

  <!-- ══════════ FRECCE ══════════ -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C92A2A"/>
    </marker>
  </defs>

  <path d="M440 500 Q 480 470 552 440" fill="none" stroke="#F59F00" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="452" y="452" font-size="11" font-weight="bold" fill="#B37500">tunnel</text>

  <path d="M700 274 L 700 190 Q 700 175 440 175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="168" font-size="11" fill="#555">egress via NAT</text>
  <path d="M1010 274 L 1010 206 Q 1010 192 704 190" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>

  <path d="M700 246 L 700 235" fill="none" stroke="#C92A2A" stroke-width="2" marker-end="url(#ax)"/>

  <!-- ══════════ COMPONENTI BLOCCATI ══════════ -->
  <rect x="40" y="880" width="1440" height="126" rx="8" fill="#f8f8f8" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="906" font-size="14" font-weight="bold" fill="#666">PREVISTI DALLO SCHEMA, IMPEDITI DAL PIANO DELL'ACCOUNT — restrizioni, non scelte</text>

  <rect x="58" y="920" width="452" height="70" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="72" y="940" font-size="13" font-weight="bold" fill="#888">Network Load Balancer</text>
  <text x="72" y="958" font-size="10.5" fill="#888">OperationNotPermitted: this AWS account currently</text>
  <text x="72" y="972" font-size="10.5" fill="#888">does not support creating load balancers</text>
  <text x="72" y="986" font-size="10.5" font-style="italic" fill="#666">Una parola in aws/k8s/nginx.yml · verificato anche da console</text>

  <rect x="526" y="920" width="452" height="70" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="540" y="940" font-size="13" font-weight="bold" fill="#888">CloudFront + S3 (frontend statico)</text>
  <text x="540" y="958" font-size="10.5" fill="#888">AccessDenied: your account must be verified before</text>
  <text x="540" y="972" font-size="10.5" fill="#888">you can add new CloudFront resources</text>
  <text x="540" y="986" font-size="10.5" font-style="italic" fill="#666">cdn.tf completo, enable_cdn = false</text>

  <rect x="994" y="920" width="452" height="70" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="1008" y="940" font-size="13" font-weight="bold" fill="#888">API Gateway + Cognito</text>
  <text x="1008" y="958" font-size="10.5" fill="#888">Il VPC Link richiede un load balancer, quindi cade</text>
  <text x="1008" y="972" font-size="10.5" fill="#888">con il blocco precedente. Cognito inoltre duplicherebbe</text>
  <text x="1008" y="986" font-size="10.5" fill="#888">user-manager, che è già il servizio di identità.</text>
</svg>
