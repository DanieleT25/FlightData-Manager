name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'microservices/**'
      - 'frontend/**'
      - 'nginx.conf'
      - 'pkg/scripts/gen_certs.sh'
      - '.gitea/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted   # shell runner — kubeconfig at ~/k8s-config

    steps:
      - uses: actions/checkout@v4

      - name: Run unit and component-integration tests
        run: go test ./...

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > terraform/id_ed25519
          chmod 600 terraform/id_ed25519

      - name: Check required deployment secrets
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENSKY_USER: ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
        run: |
          set -eu
          test -n "$NEO4J_PASSWORD"
          test -n "$POSTGRES_PASSWORD"
          test -n "$OPENSKY_USER"
          test -n "$OPENSKY_PASSWORD"

      - name: Verify cluster is reachable
        run: |
          KUBECONFIG=~/k8s-config kubectl get nodes
          KUBECONFIG=~/k8s-config kubectl get crd servicemonitors.monitoring.coreos.com

      - name: Build application images
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA:?GITHUB_SHA is not set by the runner}"
          docker build -t "flight-data/user-manager:${IMAGE_TAG}" -f microservices/user-manager/Dockerfile .
          docker build -t "flight-data/data-collector:${IMAGE_TAG}" -f microservices/data-collector/Dockerfile .
          docker build -t "flight-data/alert-system:${IMAGE_TAG}" -f microservices/alert-system/Dockerfile .
          docker build -t "flight-data/alert-notifier:${IMAGE_TAG}" -f microservices/alert-notifier-system/Dockerfile .
          docker build -t "flight-data/frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend

      - name: Import application images into every cluster node
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA:?GITHUB_SHA is not set by the runner}"
          IMAGE_TAR=$(mktemp /tmp/flight-data-images.XXXXXX)
          trap 'rm -f "$IMAGE_TAR"' EXIT

          docker save \
            "flight-data/user-manager:${IMAGE_TAG}" \
            "flight-data/data-collector:${IMAGE_TAG}" \
            "flight-data/alert-system:${IMAGE_TAG}" \
            "flight-data/alert-notifier:${IMAGE_TAG}" \
            "flight-data/frontend:${IMAGE_TAG}" \
            -o "$IMAGE_TAR"

          for NODE_IP in $(awk '/ansible_host=/{sub(/.*ansible_host=/, ""); sub(/ .*/, ""); print}' ~/k8s-hosts.ini); do
            scp -i terraform/id_ed25519 -o StrictHostKeyChecking=no "$IMAGE_TAR" "ubuntu@${NODE_IP}:/tmp/flight-data-images.tar"
            ssh -i terraform/id_ed25519 -o StrictHostKeyChecking=no "ubuntu@${NODE_IP}" \
              'sudo ctr --namespace k8s.io images import --all-platforms /tmp/flight-data-images.tar && rm -f /tmp/flight-data-images.tar'
          done

      - name: Generate runtime certificates
        run: bash pkg/scripts/gen_certs.sh

      - name: Create runtime Secrets and ConfigMaps
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENSKY_USER: ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
        run: |
          set -euo pipefail
          export KUBECONFIG=~/k8s-config

          kubectl apply -f k8s/namespace.yml
          kubectl -n flight-data create secret generic app-secrets \
            --from-literal=NEO4J_PASSWORD="$NEO4J_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=OPENSKY_USER="$OPENSKY_USER" \
            --from-literal=OPENSKY_PASSWORD="$OPENSKY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n flight-data create secret generic grpc-certs \
            --from-file=pkg/certs/ca-cert.pem \
            --from-file=pkg/certs/server-cert.pem \
            --from-file=pkg/certs/server-key.pem \
            --from-file=pkg/certs/client-cert.pem \
            --from-file=pkg/certs/client-key.pem \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n flight-data create secret generic nginx-certs \
            --from-file=pkg/certs/nginx-cert.pem \
            --from-file=pkg/certs/nginx-key.pem \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n flight-data create configmap nginx-config \
            --from-file=nginx.conf=k8s/nginx.conf \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests and select the imported image revision
        run: |
          set -euo pipefail
          export KUBECONFIG=~/k8s-config
          IMAGE_TAG="${GITHUB_SHA:?GITHUB_SHA is not set by the runner}"
          kubectl apply -f k8s/
          kubectl -n flight-data set image deployment/user-manager user-manager="flight-data/user-manager:${IMAGE_TAG}"
          kubectl -n flight-data set image deployment/data-collector data-collector="flight-data/data-collector:${IMAGE_TAG}"
          kubectl -n flight-data set image deployment/alert-system alert-system="flight-data/alert-system:${IMAGE_TAG}"
          kubectl -n flight-data set image deployment/alert-notifier alert-notifier="flight-data/alert-notifier:${IMAGE_TAG}"
          kubectl -n flight-data set image deployment/frontend frontend="flight-data/frontend:${IMAGE_TAG}"
          kubectl -n flight-data rollout restart deployment/nginx

      - name: Wait for platform and application rollout
        run: |
          set -euo pipefail
          export KUBECONFIG=~/k8s-config
          kubectl -n flight-data rollout status statefulset/redis --timeout=5m
          kubectl -n flight-data rollout status statefulset/postgres --timeout=5m
          kubectl -n flight-data rollout status statefulset/neo4j --timeout=5m
          kubectl -n flight-data rollout status statefulset/kafka --timeout=5m
          for DEPLOYMENT in frontend user-manager data-collector alert-system alert-notifier nginx; do
            kubectl -n flight-data rollout status "deployment/${DEPLOYMENT}" --timeout=5m
          done

      - name: Show running pods
        run: KUBECONFIG=~/k8s-config kubectl -n flight-data get pods -o wide

      - name: Show service endpoints
        run: |
          set -euo pipefail
          export KUBECONFIG=~/k8s-config
          kubectl -n flight-data get svc nginx
          kubectl -n flight-data get servicemonitor
          CONTROL_PLANE_IP=$(awk '/ansible_host=/{sub(/.*ansible_host=/, ""); sub(/ .*/, ""); print; exit}' ~/k8s-hosts.ini)
          echo "Application: https://${CONTROL_PLANE_IP}:30443"
          echo "Grafana:     http://${CONTROL_PLANE_IP}:32000"
