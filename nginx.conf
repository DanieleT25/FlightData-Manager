events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-manager:8080;
    }

    upstream data_service {
        server data-collector:8080;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- USER MANAGER ---
        location /users { proxy_pass http://user_service; }
        location /docs/user { proxy_pass http://user_service; }
        location /schemas/user { proxy_pass http://user_service; }


        # --- DATA COLLECTOR ---
        location /interests { proxy_pass http://data_service; }
        location /airports { proxy_pass http://data_service; }
        location /docs/data { proxy_pass http://data_service; }
        location /schemas/data { proxy_pass http://data_service; }
    }
}
