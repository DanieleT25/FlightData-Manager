events {
    worker_connections 1024;
}

http {
    # --- UPSTREAMS ---
    upstream frontend_service {
        server frontend:80;
    }

    upstream user_service {
        server user-manager:8080;
    }

    upstream data_service {
        server data-collector:8080;
    }

    # --- HEADERS GLOBALI ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- REDIRECT HTTP -> HTTPS ---
    server {
        listen 80;
        server_name flight_manager.com localhost;
        return 308 https://$host:3443$request_uri;
    }

    # --- SERVER HTTPS ---
    server {
        listen              443 ssl;
        server_name         flight_manager.com localhost;

        ssl_certificate     /etc/nginx/certs/nginx-cert.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # --- ROUTING ---
        location / {
            proxy_pass http://frontend_service;
        }
        
        # Route User Manager
        location /api/users {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://user_service;
        }

        # Route Data Collector
        location /api/interests {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://data_service;
        }
        
        location /api/airports {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://data_service;
        }
        
        # --- USER MANAGER ROUTES ---
        location /users {
            proxy_pass http://user_service; 
        }
        location /docs/user {
            proxy_pass http://user_service;
        }
        location /schemas/user {
            proxy_pass http://user_service;
        }

        # --- DATA COLLECTOR ROUTES ---
        location /interests {
            proxy_pass http://data_service;
        }
        location /airports {
            proxy_pass http://data_service;
        }
        location /docs/data {
            proxy_pass http://data_service;
        }
        location /schemas/data {
            proxy_pass http://data_service;
        }
    }
}
