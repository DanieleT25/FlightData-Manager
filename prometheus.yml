global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'user-manager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-manager:8080']
  
  - job_name: 'data-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-collector:8080']

  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']