apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: flight-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: flight-data/frontend:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flight-data
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
