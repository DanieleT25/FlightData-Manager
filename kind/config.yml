kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flight-data-cluster
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 3080
    listenAddress: "127.0.0.1"

  - containerPort: 30443
    hostPort: 3443
    listenAddress: "127.0.0.1"

  - containerPort: 30090
    hostPort: 9090
    listenAddress: "127.0.0.1"

- role: worker
- role: worker

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443