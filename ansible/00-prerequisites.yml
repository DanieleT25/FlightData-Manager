# 00-prerequisites.yml — run on every node before kubeadm init/join
---
- name: Kubernetes prerequisites on all nodes
  hosts: k8s
  become: true

  tasks:

    # ── Swap ──────────────────────────────────────────────────────────────────
    - name: Disable swap immediately
      command: swapoff -a
      changed_when: false

    - name: Disable swap permanently (comment out fstab entry)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    # ── Kernel modules ────────────────────────────────────────────────────────
    - name: Load required kernel modules
      command: "modprobe {{ item }}"
      changed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    # ── sysctl ────────────────────────────────────────────────────────────────
    - name: Persist sysctl parameters for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl parameters for Kubernetes networking
      command: sysctl --system
      changed_when: false

    # ── containerd ────────────────────────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install containerd and supporting packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - containerd
          - conntrack       # required by kubeadm preflight checks
          - socat           # required by kubeadm preflight checks
        state: present

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Read the default containerd configuration
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd to use the systemd cgroup driver
      copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"

    - name: Restart and enable containerd
      service:
        name: containerd
        state: restarted
        enabled: true

    # ── Kubernetes packages ───────────────────────────────────────────────────
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes apt signing key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: >
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: true

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages to prevent unintended upgrades
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      service:
        name: kubelet
        state: started
        enabled: true
