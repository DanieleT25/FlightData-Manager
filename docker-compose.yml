version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-manager
      - data-collector
    networks:
      - public-net

  redis:
    image: redis:alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - user-net

  user-manager:
    container_name: user-manager
    build:
      context: .
      dockerfile: microservices/user-manager/Dockerfile
    expose:
      - "8080"
      - "50051"
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - SERVER_PORT=8080
      - GRPC_PORT=50051
      - ENV=development
    volumes:
      - ./pkg/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/docs/user"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - public-net
      - service-net
      - user-net

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    #ports:
    #  - "7474:7474" # Browser UI (http://localhost:7474)
    #  - "7687:7687"
    expose:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  data-collector:
    container_name: data-collector
    build:
      context: .
      dockerfile: microservices/data-collector/Dockerfile
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
      - ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - USER_MANAGER_GRPC_HOST=user-manager:50051
      - OPENSKY_USER=${OPENSKY_USER}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD}
      - COLLECTION_INTERVAL=12h
    volumes:
      - ./pkg/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/docs/data"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      neo4j:
        condition: service_healthy
      user-manager:
        condition: service_healthy
    networks:
      - public-net
      - service-net
      - data-net

networks:
  public-net:
    driver: bridge
  service-net:
    driver: bridge
  user-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  redis_data:
  neo4j_data:
