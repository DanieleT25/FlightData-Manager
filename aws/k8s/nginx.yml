# AWS variant of k8s/nginx.yml. The Deployment is identical; only the Service
# differs, and not for the reason one would expect.
#
# The natural choice here is `type: LoadBalancer`: the nodes sit in private
# subnets with no public address, so a NodePort would be unreachable from
# outside the VPC, and the public subnets were tagged `kubernetes.io/role/elb`
# in phase 2 precisely so a load balancer could be placed in them.
#
# That is not possible on this account. Creating the Service leaves it
# `<pending>` indefinitely while the service controller retries and fails:
#
#   OperationNotPermitted: This AWS account currently does not support
#   creating load balancers.
#
# The AWS free plan refuses the CreateLoadBalancer call outright — the same
# class of restriction that blocks EC2 instance types above t3.small. It is not
# a tagging or annotation problem, and no configuration change works around it.
#
# ClusterIP is therefore the honest choice: it keeps the Service working for
# everything inside the cluster and avoids a resource that would fail forever.
# Reaching the application from a laptop is done with a forwarded port:
#
#   kubectl -n flight-data port-forward svc/nginx 8443:443
#   curl -k https://localhost:8443/docs/user
#
# Restoring the intended design needs one word — `LoadBalancer` in place of
# `ClusterIP` — on an account whose plan allows it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: flight-data
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: certs
          mountPath: /etc/nginx/certs
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: nginx-config
      - name: certs
        secret:
          secretName: nginx-certs
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: flight-data
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
