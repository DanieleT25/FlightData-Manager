name: AWS — Infrastructure

# Two entry points:
#   - a pull request touching aws/terraform/** runs `plan` and posts the diff as
#     a comment, so no infrastructure change is merged unreviewed;
#   - a manual dispatch runs `plan` or `apply`.
#
# `apply` is deliberately not wired to pushes on main: on AWS an unintended
# apply costs money, unlike the local Multipass cluster.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
  pull_request:
    paths:
      - 'aws/terraform/**'
      - '.github/workflows/aws-infra.yml'

permissions:
  id-token: write # request the OIDC token
  contents: read
  pull-requests: write # post the plan as a PR comment

env:
  AWS_REGION: eu-south-1
  TF_STATE_KEY: aws/terraform.tfstate

# Two runs applying at the same time would fight over the state lock.
concurrency:
  group: aws-infra
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pull requests opened from a fork receive no secrets, so this step fails
      # and the run stops before reaching AWS — which is the intended behaviour
      # on a public repository.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1

      - name: tofu fmt -check
        run: tofu -chdir=aws/terraform fmt -check -recursive

      - name: tofu init
        run: |
          tofu -chdir=aws/terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: tofu validate
        run: tofu -chdir=aws/terraform validate

      # The plan is not saved as an artifact on purpose: artifacts of a public
      # repository are downloadable by anyone, and a plan file holds resource
      # attributes in clear text. The apply job re-plans instead.
      - name: tofu plan
        id: plan
        run: |
          tofu -chdir=aws/terraform plan -no-color -input=false | tee plan.txt

      - name: Publish plan
        run: |
          {
            echo '### OpenTofu plan'
            echo '```hcl'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            // A PR comment cannot exceed 65536 characters.
            const body = plan.length > 60000
              ? '_Plan truncated — see the job summary for the full output._\n\n```hcl\n' + plan.slice(-60000) + '\n```'
              : '### OpenTofu plan\n\n```hcl\n' + plan + '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to
    # make every apply wait for a human approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: |
          tofu -chdir=aws/terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: tofu apply
        run: tofu -chdir=aws/terraform apply -auto-approve -input=false

      - name: Publish outputs
        run: |
          {
            echo '### Outputs'
            echo '```'
            tofu -chdir=aws/terraform output
            echo '```'
            echo ''
            echo 'Remember to run the **AWS — Destroy** workflow when finished.'
          } >> "$GITHUB_STEP_SUMMARY"
